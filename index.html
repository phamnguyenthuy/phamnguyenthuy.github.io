<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Life is not perfect so we don't have to be perfectionists!">

    <title>Thuy Pham</title>

    <link rel="shortcut icon" href="./images/favicon/fav0.webp" type="image/x-icon">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/left-sidebar.css">
    <link rel="stylesheet" href="./css/right-sidebar.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>

<body>
    <div class="full-screen">
        <!-- Header -->
        <header id="header"></header>

        <main class="two-columns-1">
            <!-- Left Sidebar -->
            <aside id="left-sidebar" class="left-sidebar"></aside>
            <div class="two-columns-2">
                <!-- Content -->
                <section class="content">
                    <div>
                        <p class="slogan">
                            Life is not perfect so we don't have to be perfectionists!
                        </p>
                    </div>
                    <div>
                        <img class="signature" src="./images/logos/signature-white.svg" alt="Signature">
                    </div>
                </section>

                <!-- Right Sidebar -->
                <aside id="right-sidebar" class="right-sidebar">
                </aside>
            </div>
        </main>

        <!-- Footer -->
        <footer id="footer"></footer>
    </div>

    <script src="js/global.js"></script>
</body>

</html>
