<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NH25X3D8MD"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-NH25X3D8MD');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Life is not perfect so we don't have to be perfectionists!">

    <title>Thuy Pham</title>

    <link rel="shortcut icon" href="./images/favicon/fav0.webp" type="image/x-icon">

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/social.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/modal.css">
</head>

<body>
    <div class="full-screen">
        <!-- Header -->
        <header id="header"></header>

        <main class="two-columns" style="grid-template-columns: max-content minmax(0, 1fr);">
            <!-- Left Sidebar -->
            <aside id="left-sidebar" class="left-sidebar"></aside>

            <!-- Chia thành 2 nửa (trên max, dưới min), có nền -->
            <section style="display: flex;
                flex-direction: column;
                height: 100%;
                border-radius: 12px 0px 0px 12px;
                background-image: url(./images/backgrounds/bg2.webp);
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.5);">
                <div style="flex: 1;">
                    Hello
                </div>
                <div style="flex: 0 0 auto;">
                    <div style="display: flex; flex: 1; width: 100%;">
                        <div style="flex: 1;">
                            <h6
                                style="padding: 12px; max-width: 360px; color: white; font-style: italic; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);">
                                We think there will always be TOMORROWS, so we waste too many TODAYS!
                            </h6>

                            <img style="padding: 12px; max-width: 180px;" src="./images/logos/signature-white.svg"
                                alt="Signature">
                        </div>

                        <!-- Right Sidebar -->
                        <aside id="right-sidebar" class="right-sidebar flex: 0 0 auto;"></aside>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer id="footer"></footer>
    </div>

    <!-- Modal -->
    <div id="modal"></div>

    <script src="js/global.js"></script>
</body>

</html>
