<!-- Contact modal -->
<div id="contact-modal" class="modal">
    <div class="modal-box" style="padding: 16px;">
        <div>
            <!-- Contact form -->
            <form action="#" method="post" style="display: flex;
                                                  flex-direction: column;">
                <label for="name">Tên</label>
                <input type="text" id="name" name="name" autocomplete="name" placeholder="Nhập tên của bạn" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="Nhập email của bạn"
                    required>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Nhập nội dung tin nhắn" rows="5" required></textarea>
                <button type="submit">Gửi</button>
            </form>
        </div>
    </div>
</div>
