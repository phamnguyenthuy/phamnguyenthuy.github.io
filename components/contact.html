<!-- Contact modal -->
<div id="contact-modal" class="modal">
    <div class="modal-box" style="padding: 16px;">
        <div>
            <!-- Contact form -->
            <form action="#" method="post" style="display: flex;
                                                  flex-direction: column;">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email"
                    required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Enter message content" rows="5" required></textarea>

                <button type="submit">Send</button>
            </form>
        </div>
    </div>
</div>
